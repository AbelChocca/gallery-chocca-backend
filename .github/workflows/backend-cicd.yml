name: Backend CI/CD

on:
  push:
    branches:
      - main
      - dev

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: backend_jean

jobs:
  test:
    name: Lint and Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      ENV: test

      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_db
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db

      REDIS_URL: redis://localhost:6379/0

      SECRET_KEY: test-secret-key
      TOKEN_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRES_SECONDS: 3600
      REFRESH_TOKEN_EXPIRES_SECONDS: 604800

      COOKIE_DOMAIN: localhost

      CLOUDINARY_NAME: test
      CLOUDINARY_API_KEY: test
      CLOUDINARY_API_SECRET: test

      ALLOW_ORIGINS: '["http://localhost:3000"]'

      REDIS_LARGE_TTL: 86400
      REDIS_MEDIUM_TTL: 3600
      REDIS_SHORT_TTL: 300
      REDIS_MIN_TTL: 60

      RECAPTCHA_SECRET_KEY: test

      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Ruff
        run: |
          uv run ruff check .

      - name: Enable PostgreSQL extensions
        run: |
          PGPASSWORD=postgres psql \
            -h localhost \
            -U postgres \
            -d test_db \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

          PGPASSWORD=postgres psql \
            -h localhost \
            -U postgres \
            -d test_db \
            -c "CREATE EXTENSION IF NOT EXISTS unaccent;"

      - name: Run tests
        run: |
          uv run pytest tests/integration tests/unit tests/e2e
